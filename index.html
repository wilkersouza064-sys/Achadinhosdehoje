<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚡ ACHADOS DE HOJE ⚡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,Helvetica,sans-serif;padding:12px}
.header{background:#FFD700;color:#000;text-align:center;padding:22px;border-radius:16px;margin-bottom:18px}
.header h1{font-weight:900;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1300px;margin:0 auto}
@media(max-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:#2a2a32;border-radius:14px;overflow:hidden;position:relative}
.card-top{position:absolute;top:8px;left:8px;background:#FFD700;color:#000;font-size:10px;font-weight:900;padding:4px 8px;border-radius:6px}
.img{height:170px;background:#2a2a32;display:flex;align-items:center;justify-content:center;padding:12px}
.img img{width:100%;height:100%;object-fit:contain}
.info{padding:10px}
.info h3{font-size:12px;min-height:32px;color:#fff}
.price{color:#FFD700;font-weight:900;font-size:16px;margin:6px 0}
.btn{display:block;background:#FFD700;color:#000;padding:8px;border-radius:8px;font-weight:900;text-decoration:none;font-size:12px;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="header"><h1>⚡ ACHADOS DE HOJE ⚡</h1><p><span id="total">0</span> ofertas</p></div>
<div class="grid" id="grid"></div>
<script>
fetch('produtos.json').then(r=>r.json()).then(p=>{
 document.getElementById('total').innerText=p.length;
 document.getElementById('grid').innerHTML=p.map(x=>`<div class="card"><div class="card-top">OFERTA</div><div class="img"><img src="${x.img}"></div><div class="info"><h3>${x.nome}</h3><div class="price">${x.preco}</div><a class="btn" href="${x.link}" target="_blank">VER OFERTA</a></div></div>`).join('')
})
</script>
</body>
</html>
